<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5A45">
<title>Órdenes B2B · Fën</title>
<link rel="icon" href="logo-fen.png?v=1.2.1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css?v=1.2.1">
<script src="config.js?v=1.2.1"></script>
</head>
<body>
<div id="cargando" class="cargando">Cargando…</div>

<section id="entrada" class="entrada oculto" aria-labelledby="t-entrar">
  <div class="marca"><img class="logo" src="logo-fen.png?v=1.2.1" alt="Fën"><span>Órdenes B2B</span></div>
  <form id="form-entrar" class="tarjeta form-entrada">
    <h1 id="t-entrar">Entrar</h1>
    <div class="campo"><label for="correo">Correo</label><input id="correo" type="email" autocomplete="username" required></div>
    <div class="campo"><label for="clave">Contraseña</label><input id="clave" type="password" autocomplete="current-password" required></div>
    <div class="error" id="error-entrada" role="alert"></div>
    <button class="btn" id="btn-entrar" type="submit">Entrar</button>
    <p class="ayuda">Este equipo queda recordado hasta que presiones "Salir".</p>
  </form>
</section>

<div id="app" class="oculto">
  <header class="barra-sup">
    <img class="logo-chico" src="logo-fen.png?v=1.2.1" alt="Fën">
    <div class="titulo"><b>Órdenes B2B</b><span id="estado-planilla" aria-live="polite"></span></div>
    <button type="button" class="btn-sec btn-chico" id="btn-salir">Salir</button>
  </header>
  <div id="aviso-modo" class="aviso oculto" role="status"></div>
  <div id="respuestas" class="respuestas" aria-live="polite"></div>
  <main id="principal">
    <section id="v-nueva" aria-labelledby="t-nueva"></section>
    <section id="v-ordenes" class="oculto" aria-labelledby="t-ordenes"></section>
    <section id="v-solicitudes" class="oculto" aria-labelledby="t-solicitudes"></section>
  </main>
  <nav class="barra-inf" aria-label="Secciones">
    <a href="#nueva" data-vista="nueva">Nueva orden</a>
    <a href="#ordenes" data-vista="ordenes">Órdenes</a>
    <a href="#solicitudes" data-vista="solicitudes">Solicitudes</a>
  </nav>
</div>
<div id="aviso-flotante" class="flotante oculto" role="status" aria-live="polite"></div>
<script type="module" src="app.js?v=1.2.1"></script>
</body>
</html>
